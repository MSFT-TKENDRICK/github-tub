name: Weekly TUB refresh

# Publishes the dated weekly edition (tub-YYYY-MM-DD tag on main) every Thursday at 17:00 US Central.
# The pipeline stops on any fetch, validation, provenance or git error; nothing is pushed unless every step passes.
on:
  schedule:
    - cron: '0 23 * * 4'
  workflow_dispatch:
    inputs:
      asof:
        description: 'Publish through this date (YYYY-MM-DD). Defaults to today in US Central time.'
        required: false
      dry:
        description: 'Print the pipeline steps without running them.'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

env:
  TZ: America/Chicago

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PowerPoint export dependency
        run: python3 -m pip install --quiet python-pptx
      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898+github-actions[bot]@users.noreply.github.com'
      - name: Tests
        run: node --test 'tests/*.test.mjs'
      - name: Refresh and publish due editions
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          ASOF: ${{ inputs.asof }}
          DRY: ${{ inputs.dry }}
        run: |
          args=()
          if [ -n "$ASOF" ]; then args+=("--asof=$ASOF"); fi
          if [ "$DRY" = "true" ]; then args+=("--dry"); fi
          node tools/refresh-weekly.mjs "${args[@]}" 2>&1 | tee refresh.log
      - name: Validate published content
        if: ${{ inputs.dry != true }}
        run: node tools/validate.mjs --quiet
      - name: Record harvest state and push
        if: ${{ inputs.dry != true }}
        run: |
          git add -A data/raw data/staging/extra
          if ! git diff --cached --quiet; then
            git commit -q -m "Harvest state through $(git tag --list 'tub-*' --sort=-refname | head -n1)" \
              -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          fi
          git push origin main --follow-tags
          latest=$(git tag --list 'tub-*' --sort=-refname | head -n1)
          {
            echo "### TUB refresh"
            echo "Latest edition: \`$latest\` ($(git rev-parse --short "$latest^{commit}"))"
            echo '```'
            tail -n 40 refresh.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body=$(printf 'The weekly TUB refresh failed and nothing was published.\n\nRun: %s\n\n```\n%s\n```\n' "$url" "$(tail -n 60 refresh.log 2>/dev/null)")
          existing=$(gh issue list --label tub-refresh --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create tub-refresh --color D93F0B --description 'Weekly TUB refresh failures' 2>/dev/null || true
            gh issue create --title 'Weekly TUB refresh failed' --label tub-refresh --body "$body"
          fi
