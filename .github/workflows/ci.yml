name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PowerPoint export dependency
        run: python3 -m pip install --quiet python-pptx
      - name: Unit, provenance and pipeline tests
        run: node --test 'tests/*.test.mjs'
      - name: Published content validates
        run: node tools/validate.mjs
